name: Update GitHub Activity Graph

on:
  schedule:
    - cron: "0 3 * * 1"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  generate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate monthly activity graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          python scripts/generate_activity.py

      - name: Commit graph
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-activity.svg

          if git diff --cached --quiet; then
            echo "No changes."

          else

            git commit \
              -m "chore: update GitHub activity graph"

            git push

          fi
